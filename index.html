<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>文字轉語音 - 支援 iPhone/iPad (含男聲)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface2: #F0EEE9;
    --border: #E0DDD6;
    --text: #1A1916;
    --text2: #6B6860;
    --blue: #2563EB;
    --blue-bg: #EFF6FF;
    --blue-border: #BFDBFE;
    --green: #16A34A;
    --green-bg: #F0FDF4;
    --green-border: #BBF7D0;
    --amber: #B45309;
    --amber-bg: #FFFBEB;
    --amber-border: #FDE68A;
    --accent: #2563EB;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  header { margin-bottom: 1.75rem; }
  header h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  header p { font-size: 14px; color: var(--text2); }

  .hint-box {
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: #1D4ED8;
    margin-bottom: 1rem;
    line-height: 1.6;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 1rem;
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.75;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--surface);
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .voice-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 1rem;
  }

  @media (max-width: 560px) {
    .voice-grid { grid-template-columns: 1fr; }
  }

  .voice-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .role-label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-a { background: var(--blue); }
  .dot-b { background: var(--green); }
  .dot-t { background: var(--amber); }
  .col-a { color: var(--blue); }
  .col-b { color: var(--green); }
  .col-t { color: var(--amber); }

  select {
    width: 100%;
    padding: 7px 10px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    cursor: pointer;
  }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .speed-row label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .speed-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .spv { font-size: 12px; font-weight: 600; min-width: 36px; text-align: right; }

  .preview-btn {
    width: 100%;
    margin-top: 10px;
    padding: 5px 0;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    cursor: pointer;
    font-family: inherit;
  }
  .preview-btn:hover { background: var(--border); }

  .gap-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
  }
  .gap-row label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .gap-row input[type=range] { flex: 1; }

  .playback-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .btn-play {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: 0.1s;
    box-shadow: 0 2px 8px rgba(37,99,235,0.25);
  }
  .btn-play:hover { background: #1D4ED8; }
  .btn-play:active { transform: scale(0.95); }
  .btn-play.paused { background: #6B7280; }

  .btn-stop {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .progress-wrap { flex: 1; min-width: 120px; }
  .progress-bg {
    height: 5px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .prog-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 11px;
    color: var(--text2);
  }

  .status-badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--surface2);
    color: var(--text2);
    white-space: nowrap;
    font-weight: 500;
  }
  .status-badge.playing { background: #DCFCE7; color: #15803D; }
  .status-badge.paused { background: #FEF3C7; color: #92400E; }
  .status-badge.done { background: var(--blue-bg); color: #1D4ED8; }

  .dialogue-box {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1rem;
    max-height: 280px;
    overflow-y: auto;
  }
  .dialogue-box.visible { display: flex; }

  .dline {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .dline.act-a { background: var(--blue-bg); border-color: var(--blue-border); }
  .dline.act-b { background: var(--green-bg); border-color: var(--green-border); }
  .dline.act-t { background: var(--amber-bg); border-color: var(--amber-border); }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .av-a { background: var(--blue-border); color: #1D4ED8; }
  .av-b { background: var(--green-border); color: #15803D; }
  .av-t { background: var(--amber-border); color: #92400E; }

  .line-text { font-size: 15px; line-height: 1.7; padding-top: 4px; }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sec {
    font-size: 13px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
  }
  .btn-sec:hover { background: var(--surface2); }

  .no-support {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #DC2626;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 1rem;
    display: none;
  }

  footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 12px;
    color: var(--text2);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎧 文字轉語音工具</h1>
    <p>A、B 對話 ＋ 旁白 · 支援 iPhone/iPad 中文男聲</p>
  </header>

  <div id="no-support" class="no-support">⚠️ 此瀏覽器不支援語音朗讀</div>

  <div class="hint-box">
    📌 格式說明：<br>
    <strong>A：</strong> 開頭 → A 角色朗讀<br>
    <strong>B：</strong> 開頭 → B 角色朗讀<br>
    其他行 → 旁白朗讀
  </div>

  <div class="card">
    <div class="card-title">對話內容</div>
    <textarea id="dialogue-input" placeholder="A：一件300。&#10;B：有打折嗎？&#10;A：抱歉，沒有。"></textarea>
  </div>

  <div class="voice-grid">
    <div class="voice-card">
      <div class="role-label col-a"><span class="dot dot-a"></span>A 角色</div>
      <select id="voice-a"></select>
      <button class="preview-btn" onclick="preview('a')">▶ 試聽 A</button>
      <div class="speed-row">
        <label>速度</label>
        <input type="range" id="sp-a" min="0.5" max="1.3" step="0.05" value="0.65"
          oninput="document.getElementById('spv-a').textContent=parseFloat(this.value).toFixed(2)+'×'">
        <span class="spv" id="spv-a">0.65×</span>
      </div>
    </div>
    <div class="voice-card">
      <div class="role-label col-b"><span class="dot dot-b"></span>B 角色</div>
      <select id="voice-b"></select>
      <button class="preview-btn" onclick="preview('b')">▶ 試聽 B</button>
      <div class="speed-row">
        <label>速度</label>
        <input type="range" id="sp-b" min="0.5" max="1.3" step="0.05" value="0.65"
          oninput="document.getElementById('spv-b').textContent=parseFloat(this.value).toFixed(2)+'×'">
        <span class="spv" id="spv-b">0.65×</span>
      </div>
    </div>
    <div class="voice-card">
      <div class="role-label col-t"><span class="dot dot-t"></span>旁白</div>
      <select id="voice-t"></select>
      <button class="preview-btn" onclick="preview('t')">▶ 試聽旁白</button>
      <div class="speed-row">
        <label>速度</label>
        <input type="range" id="sp-t" min="0.5" max="1.3" step="0.05" value="0.7"
          oninput="document.getElementById('spv-t').textContent=parseFloat(this.value).toFixed(2)+'×'">
        <span class="spv" id="spv-t">0.70×</span>
      </div>
    </div>
  </div>

  <div class="gap-row">
    <label>換場停頓</label>
    <input type="range" id="gap-dur" min="200" max="1500" step="100" value="700"
      oninput="document.getElementById('gap-val').textContent=this.value+'ms'">
    <span class="spv" id="gap-val">700ms</span>
  </div>

  <div class="playback-bar">
    <button class="btn-play" id="btn-play">▶</button>
    <button class="btn-stop" id="btn-stop">■</button>
    <div class="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-labels"><span id="line-cur">0</span><span id="line-total">0 行</span></div>
    </div>
    <span class="status-badge" id="status-msg">準備就緒</span>
  </div>

  <div class="dialogue-box" id="dialogue-box"></div>

  <div class="btn-row">
    <button class="btn-sec" id="btn-clear">🗑 清除</button>
    <button class="btn-sec" id="btn-demo">📄 載入示範</button>
  </div>

  <footer>可用螢幕錄影 · 已開啟 iPhone/iPad 男聲支援</footer>
</div>

<script>
(function(){
  const synth = window.speechSynthesis;
  if (!synth) {
    document.getElementById('no-support').style.display = 'block';
    return;
  }

  let allVoices = [];
  let lines = [], curIdx = 0, playing = false, paused = false, stopReq = false;

  // ----- 關鍵修改：支援 iOS 男聲，只移除粵語/Shelley/Sandy，不再過度過濾 -----
  function isUsableVoice(voice) {
    const lang = voice.lang.toLowerCase();
    if (!lang.startsWith('zh')) return false;
    const nameLower = (voice.name + ' ' + voice.lang).toLowerCase();
    // 只移除明確的粵語、香港、Shelley、Sandy
    if (nameLower.includes('yue') || nameLower.includes('hk') || nameLower.includes('hongkong')) return false;
    if (nameLower.includes('cantonese')) return false;
    if (nameLower.includes('shelley')) return false;
    if (nameLower.includes('sandy')) return false;
    return true;
  }

  function getVoiceDisplayName(voice) {
    let name = voice.name;
    let langTag = voice.lang;
    let label = `${name} (${langTag})`;
    let lower = name.toLowerCase();
    
    // 辨識男聲標記 (讓使用者容易找到)
    if (lower.includes('male') || lower.includes('man') || lower.includes('男生') || 
        (lower.includes('ting-ting') === false && lower.includes('yating') === false && 
         lower.includes('hanhan') === false && lower.includes('lulu') === false && 
         lower.includes('xiaoxiao') === false && lower.includes('yunxi') === false &&
         lower.includes('yaoyao') === false && lower.includes('female') === false)) {
      // 簡單啟發：如果名稱不包含典型女聲關鍵字，且包含某些男性特徵，就標記為男聲
      if (lower.includes('google') && lower.includes('mandarin')) {
        // Google 普通話預設可能是女聲，不強標
      } else if (lower.includes('wang') || lower.includes('yunyang') || lower.includes('xiaobei') || 
                 lower.includes('yunjian') || lower.includes('kangkang')) {
        label = '👨 男聲 · ' + label;
      } else if (lower.includes('male')) {
        label = '👨 男聲 · ' + label;
      } else if (!lower.includes('female') && !lower.includes('女')) {
        // 不確定的保留原樣，不要亂標
      }
    }
    
    // 常見女聲標記
    if (lower.includes('tingting') || lower.includes('yating') || lower.includes('hanhan') || 
        lower.includes('lulu') || lower.includes('xiaoxiao') || lower.includes('yunxi') || 
        lower.includes('yaoyao') || lower.includes('female')) {
      if (!label.includes('👩')) label = '👩 女聲 · ' + label;
    }
    
    return label;
  }

  function getAvailableVoices() {
    let usable = allVoices.filter(isUsableVoice);
    if (usable.length === 0) {
      // 非常寬容：只過濾最低限度
      usable = allVoices.filter(v => v.lang.startsWith('zh') && 
        !v.name.toLowerCase().includes('yue') && 
        !v.name.toLowerCase().includes('shelley') &&
        !v.name.toLowerCase().includes('sandy'));
    }
    return usable;
  }

  function populateVoiceSelects() {
    const voices = getAvailableVoices();
    if (!voices.length) {
      const msg = '<option>⚠️ 無中文語音</option>';
      ['a','b','t'].forEach(r => document.getElementById('voice-'+r).innerHTML = msg);
      return;
    }
    
    const options = voices.map((v, idx) => `<option value="${idx}">${getVoiceDisplayName(v)}</option>`).join('');
    ['a','b','t'].forEach(r => document.getElementById('voice-'+r).innerHTML = options);
    
    // 智慧預設：A 選第一個女聲，B 選第一個男聲，旁白選中性
    let femaleIdx = voices.findIndex(v => /female|tingting|yating|hanhan|lulu|xiaoxiao|yunxi|yaoyao|女/i.test(v.name));
    let maleIdx = voices.findIndex(v => /male|yunyang|xiaobei|yunjian|wang|kangkang|男/i.test(v.name));
    
    if (femaleIdx !== -1) document.getElementById('voice-a').selectedIndex = femaleIdx;
    if (maleIdx !== -1) document.getElementById('voice-b').selectedIndex = maleIdx;
    
    // 旁白預設選第三個或第二個
    if (voices.length > 2) {
      let tIdx = 2;
      if (tIdx === femaleIdx || tIdx === maleIdx) tIdx = (tIdx+1) % voices.length;
      document.getElementById('voice-t').selectedIndex = tIdx;
    } else if (voices.length === 2) {
      document.getElementById('voice-t').selectedIndex = 1;
    }
  }

  function loadVoices() {
    allVoices = synth.getVoices();
    if (!allVoices.length) {
      setTimeout(loadVoices, 100);
      return;
    }
    populateVoiceSelects();
  }
  
  if (synth) {
    if (synth.getVoices().length) loadVoices();
    synth.onvoiceschanged = loadVoices;
    loadVoices();
  }

  function preview(role) {
    if (!synth) return;
    synth.cancel();
    const voices = getAvailableVoices();
    const idx = parseInt(document.getElementById('voice-'+role).value);
    const rate = parseFloat(document.getElementById('sp-'+role).value);
    const text = { a:'你好，我是A角色。', b:'你好，我是B角色。', t:'這是旁白聲音。' }[role];
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate;
    if (!isNaN(idx) && voices[idx]) u.voice = voices[idx];
    synth.speak(u);
  }
  window.preview = preview;

  function parseLines(txt) {
    return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      let m = l.match(/^([AB])[：:]\s*(.+)/i);
      if(m) return { role: m[1].toUpperCase(), text: m[2].trim() };
      return { role: 'T', text: l };
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m));
  }
  
  function renderDialogue(active) {
    let box = document.getElementById('dialogue-box');
    box.classList.add('visible');
    box.innerHTML = lines.map((l,i)=>`
      <div class="dline ${i===active ? (l.role==='A'?'act-a':l.role==='B'?'act-b':'act-t') : ''}" id="dl-${i}">
        <div class="avatar ${l.role==='A'?'av-a':l.role==='B'?'av-b':'av-t'}">${l.role==='A'?'A':l.role==='B'?'B':'師'}</div>
        <div class="line-text">${escapeHtml(l.text)}</div>
      </div>
    `).join('');
    let el = document.getElementById('dl-'+active);
    if(el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function setStatus(txt, cls) {
    let el = document.getElementById('status-msg');
    el.textContent = txt;
    el.className = 'status-badge' + (cls ? ' '+cls : '');
  }
  function setPlayBtn(isp) {
    let btn = document.getElementById('btn-play');
    btn.innerHTML = isp ? '⏸' : '▶';
    btn.className = 'btn-play' + (isp ? '' : ' paused');
  }

  async function speakLine(idx) {
    if(stopReq || idx>=lines.length) { finish(); return; }
    curIdx = idx;
    renderDialogue(idx);
    document.getElementById('line-cur').innerText = idx+1;
    document.getElementById('prog-fill').style.width = Math.round((idx/lines.length)*100)+'%';
    let l = lines[idx];
    let roleKey = l.role==='A' ? 'a' : (l.role==='B' ? 'b' : 't');
    let voices = getAvailableVoices();
    let selIdx = parseInt(document.getElementById('voice-'+roleKey).value);
    let rate = parseFloat(document.getElementById('sp-'+roleKey).value);
    let targetVoice = (!isNaN(selIdx) && voices[selIdx]) ? voices[selIdx] : null;
    await new Promise(res=>{
      let u = new SpeechSynthesisUtterance(l.text);
      u.rate = rate;
      if(targetVoice) u.voice = targetVoice;
      u.onend = res;
      u.onerror = ()=>res();
      synth.speak(u);
    });
    if(stopReq) { finish(); return; }
    let gap = parseInt(document.getElementById('gap-dur').value);
    await new Promise(r=>setTimeout(r,gap));
    if(!stopReq && playing && !paused) speakLine(idx+1);
  }

  function start() {
    let text = document.getElementById('dialogue-input').value.trim();
    if(!text) { setStatus('請輸入內容'); return; }
    lines = parseLines(text);
    if(!lines.length) { setStatus('無效行'); return; }
    document.getElementById('line-total').innerText = lines.length+' 行';
    playing = true; paused = false; stopReq = false;
    setPlayBtn(true);
    setStatus('朗讀中...','playing');
    document.getElementById('prog-fill').style.width = '0%';
    if(synth) synth.cancel();
    speakLine(0);
  }
  function finish() {
    playing = false; paused = false;
    setPlayBtn(false);
    if(stopReq) {
      setStatus('已停止');
      document.getElementById('prog-fill').style.width = '0%';
      document.getElementById('line-cur').innerText = '0';
    } else {
      setStatus('完成 ✓','done');
      document.getElementById('prog-fill').style.width = '100%';
      document.getElementById('line-cur').innerText = lines.length;
    }
    stopReq = false;
  }

  document.getElementById('btn-play').addEventListener('click',()=>{
    if(!synth) return;
    if(!playing && !paused) { start(); return; }
    if(playing && !paused) {
      synth.pause(); playing=false; paused=true;
      setPlayBtn(false); setStatus('已暫停','paused');
    } else if(paused) {
      synth.resume(); paused=false; playing=true;
      setPlayBtn(true); setStatus('朗讀中...','playing');
      if(!stopReq && lines.length && curIdx<lines.length && !synth.speaking && !synth.pending) speakLine(curIdx);
    }
  });
  document.getElementById('btn-stop').addEventListener('click',()=>{
    stopReq=true; playing=false; paused=false;
    if(synth) synth.cancel();
    setPlayBtn(false); setStatus('已停止');
    document.getElementById('prog-fill').style.width='0%';
    document.getElementById('line-cur').innerText='0';
    document.getElementById('dialogue-box').classList.remove('visible');
  });
  document.getElementById('btn-clear').addEventListener('click',()=>{
    stopReq=true; synth&&synth.cancel();
    document.getElementById('dialogue-input').value='';
    document.getElementById('dialogue-box').classList.remove('visible');
    document.getElementById('prog-fill').style.width='0%';
    document.getElementById('line-cur').innerText='0';
    document.getElementById('line-total').innerText='0 行';
    setStatus('準備就緒');
    playing=false; paused=false; setPlayBtn(false);
  });
  document.getElementById('btn-demo').addEventListener('click',()=>{
    document.getElementById('dialogue-input').value = `聽男女對話，回答問題。\nA：歡迎光臨，看看哦！\nB：你好，請問有台灣特色的T恤嗎？\nA：有，您自己穿還是送人呢？\nB：送人。\nA：好的，這是今年的新款，您覺得怎麼樣？\nB：這件太紅了。\nA：我們有5種顏色。\nB：多少錢？\nA：一件300。\nB：有打折嗎？\nA：抱歉，沒有。\nB：我多買幾件，可以打折嗎？\nA：可以，買5送1。\nB：那，黑、黃、藍各兩件。\n請問男的最後買了幾件？`;
  });
})();
</script>

</html>
